<svg
	xmlns="http://www.w3.org/2000/svg"
	viewBox="0 0 23 23"
	shape-rendering="crispEdges"
	preserveAspectRatio="xMidYMid meet"
>
	<!--
		The moon the `game-night-light` hero casts its light from. Palette:
		`#ffffff` face, `#a8a29e` (stone-400) 1px rim, crags in `#d6d3d1`
		(stone-300) and `#e7e5e4` (stone-200). The rim is what keeps the disc
		readable at all, since the sky directly behind it is driven to near-white
		by the glow in `Invite.astro`; the 23-unit grid is chosen so one moon pixel
		lands at about the same size as one cloud pixel at the sizes they render.
	-->
	<title>Pixel moon</title>
